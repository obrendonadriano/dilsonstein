<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso | Painel Dilson Stein</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/painel/painel.css?v=2">
  <script src="/config.js?v=6"></script>
</head>
<body class="panel-page">
  <div class="panel-backdrop"></div>

  <main class="panel-shell auth-shell">
    <section class="auth-card">
      <div class="auth-brand">
        <img src="/img/logo-dourada.png" alt="Dilson Stein">
        <span class="eyebrow">Acesso restrito</span>
      </div>

      <div class="auth-copy">
        <h1>Painel Dilson Stein</h1>
        <p>Entre para visualizar os agendamentos, editar cidades e horários e exportar as planilhas da seleção.</p>
      </div>

      <form id="login-form" class="login-form auth-form">
        <label>
          Login
          <input type="text" id="login-username" placeholder="admin" autocomplete="username" required>
        </label>
        <label>
          Senha
          <input type="password" id="login-password" placeholder="admin" autocomplete="current-password" required>
        </label>
        <button type="submit" class="primary-button">Entrar no painel</button>
        <p id="login-status" class="status-text" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="/painel/login.js?v=1"></script>
</body>
</html>
