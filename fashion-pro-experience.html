<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fashion PRO Experience | Dilson Stein</title>
  <meta
    name="description"
    content="O que você faz agora pode mudar onde você estará daqui a 6 meses. Conheça a Fashion PRO Experience da Dilson Stein."
  >
  <meta property="og:title" content="Fashion PRO Experience | Dilson Stein">
  <meta property="og:description" content="Uma nova página inspirada na Fashion PRO Experience da Dilson Stein.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <link rel="icon" type="image/png" href="img/fivecoin.png">
  <link rel="apple-touch-icon" href="img/fivecoin.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="fashion-pro-experience.css?v=1">
</head>
<body>
  <header class="fp-topbar">
    <div class="fp-topbar-shell">
      <img class="fp-brand-logo" src="img/logo-dourada.png" alt="Dilson Stein">
      <img class="fp-event-logo" src="img-dilson/fashion-pro.webp" alt="Fashion PRO International">
    </div>
  </header>

  <main class="fp-page">
    <section class="fp-legacy">
      <div class="fp-copy">
        <h1>O que você faz agora... pode mudar onde você estará daqui a 6 meses.</h1>
        <p>Quem conquistou espaço na moda um dia disse "sim" para uma oportunidade real.</p>
        <p>Agora é sua vez. Agências já confirmadas. As vagas são limitadas.<br>O próximo nome pode ser o seu!</p>
      </div>

      <div class="fp-gallery-shell">
        <div class="fp-gallery">
          <article class="fp-card fp-card-side">
            <img src="img-dilson/meninas.webp" alt="Talentos da Dilson Stein">
          </article>

          <article class="fp-card fp-card-feature">
            <img src="img-dilson/modelos/emanuelramos.webp" alt="Emanuel Ramos">
            <div class="fp-card-overlay"></div>
            <div class="fp-card-body">
              <span class="fp-pill">Fashion PRO</span>
              <strong>Emanuel Ramos</strong>
            </div>
          </article>

          <article class="fp-card fp-card-feature">
            <img src="img-dilson/modelos/laurapigatto.webp" alt="Laura Pigatto">
            <div class="fp-card-overlay"></div>
            <div class="fp-card-body">
              <span class="fp-pill">Fashion PRO</span>
              <strong>Laura Pigatto</strong>
            </div>
          </article>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
